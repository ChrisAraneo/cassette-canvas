<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cassette Canvas Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d0b16;
        color: #c9c4dc;
        font-family: system-ui, sans-serif;
      }

      main {
        display: grid;
        gap: 8px;
        justify-items: center;
        padding: 16px;
        /* Both canvases (1280 by 720 and 1280 by 288) fit on the screen. */
        width: min(
          1280px,
          calc(100vw - 32px),
          calc((100vh - 96px) * 1280 / 1008)
        );
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
        border: 1px solid #2a2540;
      }

      #hud {
        /* Not one of the palette colors, so every swatch stands out. */
        background: #221e33;
      }

      p {
        margin: 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="street" width="1280" height="720">
        This demo needs a browser that supports canvas and WebGL.
      </canvas>
      <canvas id="hud" width="1280" height="288"></canvas>
      <p>16 colors × 8 shades · 4px pixels · 8×8 sprites</p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
