<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cassette Canvas Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d0b16;
        color: #c9c4dc;
        font-family: system-ui, sans-serif;
      }

      main {
        display: grid;
        gap: 12px;
        justify-items: center;
        padding: 16px;
      }

      canvas {
        display: block;
        max-width: 100%;
        height: auto;
        image-rendering: pixelated;
        border: 1px solid #2a2540;
      }

      p {
        margin: 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="screen" width="1280" height="720">
        This demo needs a browser that supports canvas and WebGL.
      </canvas>
      <p>16 colors × 8 shades · 4px pixels · 8×8 sprites</p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
